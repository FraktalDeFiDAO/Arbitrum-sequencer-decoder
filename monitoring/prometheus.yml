global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'arbitrum-sequencer'
    static_configs:
      - targets: ['sequencer-reader:8080']
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres:9187']
    scrape_interval: 15s

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis:9121']
    scrape_interval: 15s